<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>墨阅</title>
  <link rel="icon" href="/icons/icon.svg" />
  <style>
    /* 在 Vue 挂载前显示加载动画 */
    #app-loading {
      position: fixed; inset: 0; z-index: 9999;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      background: #0d0d0d;
      transition: opacity 0.4s ease;
    }
    #app-loading.hidden { opacity: 0; pointer-events: none; }
    .loader-logo {
      font-family: Georgia, serif;
      color: #d4a017; font-size: 48px;
      letter-spacing: 0.2em; margin-bottom: 24px;
    }
    .loader-subtitle {
      font-family: system-ui, sans-serif;
      color: rgba(160,152,136,0.5);
      font-size: 11px; letter-spacing: 0.3em;
      margin-bottom: 32px;
    }
    .loader-dots { display: flex; gap: 8px; }
    .loader-dot {
      width: 6px; height: 6px; background: #d4a017;
      border-radius: 50%;
      animation: breathe 1.4s infinite ease-in-out both;
    }
    .loader-dot:nth-child(1) { animation-delay: 0s; }
    .loader-dot:nth-child(2) { animation-delay: 0.2s; }
    .loader-dot:nth-child(3) { animation-delay: 0.4s; }
    @keyframes breathe {
      0%, 80%, 100% { transform: scale(0.8); opacity: 0.4; }
      40% { transform: scale(1.2); opacity: 1; }
    }
  </style>
</head>
<body>
  <div id="app-loading">
    <div class="loader-logo">墨 阅</div>
    <div class="loader-subtitle">AbyssReader</div>
    <div class="loader-dots">
      <span class="loader-dot"></span>
      <span class="loader-dot"></span>
      <span class="loader-dot"></span>
    </div>
  </div>
  <div id="app"></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
