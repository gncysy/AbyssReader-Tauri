[package]
name = "abyss-reader-tauri"
version = "0.1.0"
edition = "2021"

[lib]
name = "abyss_reader_tauri_lib"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "abyss-reader-tauri"
path = "src/main.rs"

[dependencies]
arboard = "3"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-store = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "cookies", "gzip", "brotli", "rustls-tls"] }
rusqlite = { version = "0.32", features = ["bundled"] }
encoding_rs = "0.8"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
thiserror = "2"
once_cell = "1"
parking_lot = "0.12"
url = "2"
regex = "1"
fancy-regex = "0.14"
md5 = "0.7"
urlencoding = "2.1"
deno_core = "0.315"
scraper = "0.20"
aes = "0.8"
cbc = "0.1"
uuid = { version = "1", features = ["v4"] }
open = "5"
hanconv = "0.5"
oxc_parser = "0.47"
oxc_ast = "0.47"
oxc_codegen = "0.47"
oxc_allocator = "0.47"
oxc_span = "0.47"
oxc_semantic = "0.47"
rsa = { version = "0.9", features = ["pem", "sha2"] }
pkcs8 = { version = "0.10", features = ["pem", "encryption"] }
rand = "0.8"
dirs-next = "2.0"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[profile.dev]
debug = 0
